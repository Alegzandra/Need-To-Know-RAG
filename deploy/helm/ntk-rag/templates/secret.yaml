{{- if not .Values.security.existingUsersSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ntk.fullname" . }}-users
  labels: {{- include "ntk.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.yaml: |
{{ .Values.security.usersYaml | default "users: []" | indent 4 }}
{{- end }}
