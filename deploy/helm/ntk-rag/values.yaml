image:
  repository: registry.local/ntk-rag
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# One replica while the audit log is a local hash-chained file. For more replicas,
# ship audit records to a central append-only store (SIEM / WORM) first.
replicaCount: 1

env:
  NTK_LLM_BACKEND: openai                     # vLLM exposes an OpenAI-compatible API
  NTK_OPENAI_BASE_URL: http://vllm:8000/v1
  NTK_LLM_MODEL: openai/gpt-oss-20b
  NTK_EMBED_MODEL: bge-m3
  OLLAMA_BASE_URL: http://ollama:11434         # embeddings served by Ollama in this example
  NTK_QDRANT_URL: http://qdrant:6333           # deploy Qdrant with its official Helm chart
  NTK_TOP_K: "6"

# Security configuration is provided by the security officer, not baked into the image.
security:
  compartments: [ORION, HALCYON]
  existingUsersSecret: ""                      # name of a Secret with key users.yaml; empty -> chart creates one from usersYaml
  usersYaml: ""

persistence:
  size: 2Gi
  storageClass: ""

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }

service:
  port: 8080
