# Laptop / single-server stack: API + Qdrant + Ollama (gpt-oss + bge-m3), fully offline after the first pull.
#   docker compose up -d && docker compose run --rm ollama-pull
# GPU server with vLLM instead of Ollama:
#   docker compose --profile vllm up -d   (and set NTK_LLM_BACKEND=openai for the api service)
services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_TAG:-latest}   # pin a version for production
    volumes: [qdrant:/qdrant/storage]
    ports: ["6333:6333"]

  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    # Uncomment on a machine with an NVIDIA GPU + nvidia-container-toolkit:
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  ollama-pull:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    profiles: ["setup"]
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["sh", "-c", "ollama pull gpt-oss:20b && ollama pull bge-m3"]
    depends_on: [ollama]

  vllm:
    image: vllm/vllm-openai:${VLLM_TAG:-latest}
    profiles: ["vllm"]
    command: ["--model", "openai/gpt-oss-20b", "--gpu-memory-utilization", "0.90"]
    ports: ["8000:8000"]
    volumes: [hf:/root/.cache/huggingface]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }

  api:
    build: .
    environment:
      NTK_QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      NTK_LLM_BACKEND: ${NTK_LLM_BACKEND:-ollama}
      NTK_OPENAI_BASE_URL: http://vllm:8000/v1
      NTK_LLM_MODEL: ${NTK_LLM_MODEL:-gpt-oss:20b}
    volumes: [ntkdata:/data]
    ports: ["8080:8080"]
    depends_on: [qdrant, ollama]
    read_only: true
    tmpfs: [/tmp]

volumes: { qdrant: {}, ollama: {}, hf: {}, ntkdata: {} }
